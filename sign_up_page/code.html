<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const pwdIcon = document.getElementById('passwordIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdIcon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                pwdIcon.textContent = 'visibility';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Interaction: Show success toast
            const toast = document.getElementById('successToast');
            toast.classList.remove('translate-y-[200%]');
            toast.classList.add('translate-y-0');

            setTimeout(() => {
                window.location.href = '../privacy_notice_page/code.html';
            }, 900);
            
            // In a real app, this would handle form data
        });

        // Simple floating animation for bg circles
        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelectorAll('.fixed > div').forEach((circle, index) => {
                const factor = index === 0 ? 1 : -1.5;
                circle.style.transform = `translate(${moveX * factor}px, ${moveY * factor}px)`;
            });
        });
    </script>
